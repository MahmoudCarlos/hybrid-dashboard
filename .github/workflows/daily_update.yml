name: Daily Fleet Data Auto-Update

on:
  schedule:
    # التحديث اليومي الساعة 2:30 ظهراً بتوقيت القاهرة.
    # GitHub يقبل UTC فقط، ومصر تتغير بين UTC+2 (شتاء) و UTC+3 (صيف)،
    # فنضع موعدين ونسمح بتشغيل المناسب منهما فقط (انظر خطوة "فحص التوقيت").
    - cron: '30 11 * * *'   # = 2:30 م القاهرة وقت التوقيت الصيفي (UTC+3)
    - cron: '30 12 * * *'   # = 2:30 م القاهرة وقت التوقيت الشتوي (UTC+2)
  # إمكانية تشغيله يدوياً في أي وقت بضغطة زر للتجربة
  workflow_dispatch:

jobs:
  update-data:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: فحص التوقيت
        id: gate
        run: |
          OFFSET=$(TZ=Africa/Cairo date +%z)
          EVENT="${{ github.event_name }}"
          SCHEDULE="${{ github.event.schedule }}"
          RUN=false
          if [ "$EVENT" = "workflow_dispatch" ]; then RUN=true
          elif [ "$OFFSET" = "+0200" ] && [ "$SCHEDULE" = "30 12 * * *" ]; then RUN=true
          elif [ "$OFFSET" = "+0300" ] && [ "$SCHEDULE" = "30 11 * * *" ]; then RUN=true
          fi
          echo "Cairo offset: $OFFSET | trigger: $EVENT $SCHEDULE | run: $RUN"
          echo "run=$RUN" >> "$GITHUB_OUTPUT"

      - name: جلب كود المشروع
        if: steps.gate.outputs.run == 'true'
        uses: actions/checkout@v4

      - name: إعداد بيئة بايثون
        if: steps.gate.outputs.run == 'true'
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: تثبيت المكتبات المطلوبة
        if: steps.gate.outputs.run == 'true'
        run: |
          pip install gspread google-auth pandas

      - name: تشغيل سكربت سحب الشيت
        if: steps.gate.outputs.run == 'true'
        env:
          GCP_SA_KEY: ${{ secrets.GCP_SA_KEY }}
          SPREADSHEET_ID: ${{ secrets.SPREADSHEET_ID }}
        run: |
          python fetch_data.py

      - name: حفظ ورفع الملف الجديد على جيت هب
        if: steps.gate.outputs.run == 'true'
        run: |
          git config --global user.name 'github-actions[bot]'
          git config --global user.email 'github-actions[bot]@users.noreply.github.com'
          git add data.csv.csv
          git diff --quiet && git diff --staged --quiet || (git commit -m "تحديث تلقائي للبيانات اليومية" && git push)
